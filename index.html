<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffb6c1;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  color: #fff;
  font-size: 2.5em;
  margin-bottom: 30px;
}

.buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
}

button {
  font-size: 1.2em; /* texte principal du bouton */
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #fff;
  color: #ff4d6d;
}

.message {
  margin-top: 20px;
  color: white;
  font-size: 1.2em;
}

/* Texte plus petit pour le span "Appuie" */
#yes span {
  display: block;
  font-size: 0.5em; /* environ deux fois plus petit que "Oui" */
  margin-top: 5px;
}

.love-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ff69b4;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.love-text {
  font-size: 4em;
  color: white;
  z-index: 2;
}

.heart {
  position: absolute;
  color: red;
  font-size: 2em;
  animation: fall linear infinite;
}

@keyframes fall {
  from { transform: translateY(-10vh); }
  to { transform: translateY(110vh); }
}
</style>
</head>
<body>

<div class="container" id="main">
  <h1>Veux-tu être ma Valentine ? 💝</h1>
  <div class="buttons">
    <button id="yes">Oui <span id="yesText"></span></button>
    <button id="no">Non</button>
  </div>
  <div class="message" id="msg"></div>
</div>

<script>
let noCount = 0;
let yesStep = 0; // 0 = premier clic Oui, 1 = plein écran, 2+ = petits textes
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const msg = document.getElementById("msg");
const yesText = document.getElementById("yesText");

// Gestion du bouton Non
noBtn.addEventListener("click", () => {
  noCount++;

  if (noCount === 1) {
    msg.textContent = "Mauvaise réponse, réessaye 🫤";
    yesBtn.style.transform = "scale(1.5)";
  } 
  else if (noCount >= 2) {
    msg.textContent = "";
    yesBtn.style.position = "fixed";
    yesBtn.style.top = "0";
    yesBtn.style.left = "0";
    yesBtn.style.width = "100%";
    yesBtn.style.height = "100%";
    yesBtn.style.fontSize = "3em";
    noBtn.style.display = "none";
    yesText.textContent = "Appuie"; // texte par défaut plein écran
    yesStep = 2; // prochaine étape = clics successifs pour textes
  }
});

// Gestion du bouton Oui
yesBtn.addEventListener("click", () => {
  if (yesStep === 0) {
    // Premier clic Oui normal
    msg.textContent = "For sure???";
    yesBtn.style.transform = "scale(1.5)";
    yesStep = 1; // prochaine étape = plein écran
    noBtn.style.display = "none"; // Non disparaît dès le premier clic
  } 
  else if (yesStep === 1) {
    // Bouton plein écran après premier Oui
    yesBtn.style.position = "fixed";
    yesBtn.style.top = "0";
    yesBtn.style.left = "0";
    yesBtn.style.width = "100%";
    yesBtn.style.height = "100%";
    yesBtn.style.fontSize = "3em";
    noBtn.style.display = "none";
    msg.textContent = "";
    yesText.textContent = "Appuie"; // texte par défaut plein écran
    yesStep = 2; // prochaine étape = clics successifs
  } 
  else if (yesStep >= 2) {
    yesStep++;
    if (yesStep === 3) yesText.textContent = "Click bien!!!";
    else if (yesStep === 4) yesText.textContent = "Encore!!!!!!!";
    else if (yesStep >= 5) {
      // Page finale avec coeurs
      document.body.innerHTML = `
        <div class="love-screen">
          <div class="love-text">JE T’AIME ❤️</div>
        </div>
      `;
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);
      }
    }
  }
});
</script>

</body>
</html>
